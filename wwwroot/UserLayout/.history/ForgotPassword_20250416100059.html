<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page - Brisheam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css"
    />

    <link rel="stylesheet" href="./css/Login.css" />
  </head>
  <body>
    <div class="login-container">
      <!-- Phần bên trái: Form đăng nhập -->
      <div class="login-form">
        <!-- Logo -->
        <div class="logo">
          <i class="fa-solid fa-book-open" style="margin-right: 10px"></i>
          SmartLearn
        </div>

        <!-- Tiêu đề -->
        <h1>Password Reset</h1>
        <p>
          Provide the email address asscociated with your account to recover
          your password
        </p>
        <!-- Form đăng nhập -->
        <form>
          <!-- Trường Username -->
          <div class="input-group">
            <label for="username">Email</label>
            <input
              type="text"
              id="username"
              placeholder="deniel123@gmail.com"
            />
          </div>
          <!-- Nút Sign In -->
          <button type="submit" class="sign-in-btn">Reset Password</button>
          <div class="option"><a href="">Login</a> <a href="">Register</a></div>
        </form>
      </div>

      <!-- Phần bên phải: Hình minh họa -->
      <div class="illustration">
        <!-- Thay bằng hình minh họa thực tế -->
        <img src="./images/Exlorer_Illustration 1.png" alt="Illustration" />
      </div>
    </div>
  </body>
</html>
